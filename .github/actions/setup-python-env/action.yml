# .github/actions/setup-python-env/action.yml
name: "Setup Python environment"
description: "Install Python + dev dependencies (site-packages cache for 3.11 only)"

inputs:
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      id: setup-python
      with:
        python-version: ${{ inputs.python-version }}

    # --------------------------------------------------------------
    # Cache installed environment ONLY when python-version is exactly 3.11
    # --------------------------------------------------------------
    - name: Cache installed Python environment (3.11 only)
      id: cache-venv
      if: inputs.python-version == '3.11'
      uses: actions/cache@v6
      with:
        path: ${{ env.pythonLocation }}
        key: pyenv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

    # h5py publishes no cp315 wheels yet, so on 3.15 pip builds it from source
    # and needs the HDF5 headers. Remove this step once cp315 wheels exist.
    - name: Install HDF5 headers (3.15 only)
      if: inputs.python-version == '3.15'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q libhdf5-dev pkg-config
        echo "HDF5_DIR=/usr/lib/x86_64-linux-gnu/hdf5/serial" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      # Skip the whole step when:
      #   - cache exists AND python-version == '3.11'
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m pip install --quiet --upgrade pip
        pip install --quiet -r requirements-dev.txt
