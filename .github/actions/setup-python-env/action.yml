# .github/actions/setup-python-env/action.yml
name: "Setup Python environment"
description: "Install uv, Python and the locked dependencies (incl. the dev group) into .venv"

inputs:
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    # setup-uv installs the requested Python and caches uv's downloads, keyed on uv.lock.
    # activate-environment puts .venv on the PATH, so later steps call ruff, pytest, ... directly.
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        activate-environment: true

    # --locked fails if uv.lock is out of date with pyproject.toml.
    - name: Install dependencies
      shell: bash
      run: uv sync --locked
